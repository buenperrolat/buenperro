<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rutina personalizada de modales para tu perro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#FF5A3C;        /* coral principal */
    --accent-dark:#E8402A;
    --accent-soft:#FFE9E4;
    --blue:#2E9BD6;
    --blue-soft:#EAF5FB;
    --yellow-soft:#FFF6DC;
    --ink:#26303B;
    --ink-soft:#5B6672;
    --line:#EDF0F3;
    --card:#F3F6F8;
    --ok:#22A867;
    --bad:#E23B3B;
    --radius:14px;
    --maxw:480px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:#fff;min-height:100vh}
  #app{max-width:var(--maxw);margin:0 auto;padding:0 20px 48px;min-height:100vh;display:flex;flex-direction:column}

  /* ---------- Header ---------- */
  header{display:flex;align-items:center;justify-content:center;position:relative;padding:14px 0 10px}
  .back{position:absolute;left:0;top:12px;background:none;border:none;font-size:22px;color:var(--ink);cursor:pointer;padding:4px 10px;line-height:1}
  .logo{display:flex;align-items:center;gap:6px;font-weight:900;font-size:15px}
  .logo .paw{width:22px;height:22px;border-radius:6px;background:linear-gradient(160deg,var(--accent),var(--accent-dark));display:flex;align-items:center;justify-content:center;font-size:12px}
  .progress{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}
  .progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}

  /* ---------- Tipografía de pantalla ---------- */
  h1{font-size:21px;font-weight:900;text-align:center;line-height:1.3;margin-bottom:8px}
  h1 .acc{color:var(--accent)}
  h1 .accb{color:var(--blue)}
  .sub{text-align:center;color:var(--ink-soft);font-size:13.5px;font-weight:600;margin-bottom:22px;line-height:1.45}

  /* ---------- Tarjetas de opción ---------- */
  .opt{width:100%;display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid transparent;border-radius:var(--radius);padding:15px 16px;margin-bottom:12px;cursor:pointer;text-align:left;font-family:inherit;transition:border-color .15s,background .15s}
  .opt:hover{border-color:#d7dee4}
  .opt.sel{background:var(--blue-soft);border-color:var(--blue)}
  .opt .em{font-size:26px;flex:0 0 34px;text-align:center}
  .opt .tx b{display:block;font-size:15.5px;font-weight:800}
  .opt .tx span{font-size:13px;color:var(--ink-soft);font-weight:600}
  .opt .chk{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid #C9D2DA;flex:0 0 20px;position:relative}
  .opt.sel .chk{border-color:var(--blue);background:var(--blue)}
  .opt.sel .chk::after{content:'';position:absolute;inset:4px;border-radius:50%;background:#fff}

  /* ---------- Chips ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:18px}
  .chip{background:var(--card);border:2px solid transparent;border-radius:99px;padding:8px 15px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .chip.sel{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .field-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
  select,input[type=text],input[type=email]{width:100%;border:1.5px solid #D9E0E6;border-radius:10px;padding:13px 14px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff;outline:none}
  select:focus,input:focus{border-color:var(--blue)}

  /* ---------- Likert ---------- */
  .likert-wrap{margin-top:auto;padding-top:40px}
  .likert{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .likert button{background:#fff;border:none;border-right:1px solid var(--line);padding:16px 0;font-size:24px;cursor:pointer;transition:background .15s;font-family:inherit}
  .likert button:last-child{border-right:none}
  .likert button.sel{background:var(--blue-soft);box-shadow:inset 0 0 0 2px var(--blue)}
  .likert-labels{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-top:8px}

  /* ---------- Botones ---------- */
  .btn{display:block;width:100%;background:linear-gradient(180deg,var(--accent),var(--accent-dark));color:#fff;border:none;border-radius:12px;padding:16px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:20px;box-shadow:0 6px 16px rgba(232,64,42,.25)}
  .btn:disabled{background:#F5B7AC;box-shadow:none;cursor:default}
  .btn.big{font-size:16px;text-transform:uppercase;letter-spacing:.3px}

  /* ---------- Interstitials ---------- */
  .quote{background:var(--blue-soft);border-radius:var(--radius);padding:18px 18px 14px;margin:18px 0}
  .quote .qm{color:var(--accent);font-size:30px;font-weight:900;line-height:.5;display:block;margin-bottom:10px}
  .quote p{font-weight:800;font-size:15px;line-height:1.5}
  .quote .who{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid #d5e8f4;font-size:12.5px;color:var(--ink-soft);font-weight:700}
  .trust{margin:14px 0}
  .trust li{list-style:none;font-size:13.5px;font-weight:700;padding:6px 0;display:flex;gap:8px}
  .trust li::before{content:'✔️'}
  .note-card{background:var(--yellow-soft);border-radius:12px;padding:14px 16px;font-size:13.5px;font-weight:700;text-align:center;line-height:1.5;margin:16px 0}
  .img-slot{width:100%;border-radius:var(--radius);background:linear-gradient(140deg,#e8eef2,#f6f9fb);margin:16px 0;overflow:hidden;line-height:0}
  .img-slot img{width:100%;height:auto;display:block}
  .caption{text-align:center;font-size:13px;color:var(--ink-soft);font-weight:600;line-height:1.5;margin-bottom:8px}
  .center-copy{text-align:center;font-size:14px;font-weight:600;line-height:1.6;color:var(--ink-soft);margin:14px 0}
  .center-copy b{color:var(--ink)}
  .cal{font-size:64px;text-align:center;margin:20px 0}

  /* ---------- Loading ---------- */
  .ring-wrap{display:flex;flex-direction:column;align-items:center;margin:26px 0 10px}
  .ring{position:relative;width:120px;height:120px}
  .ring svg{transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:9;stroke-linecap:round}
  .ring .bg{stroke:var(--line)}
  .ring .fg{stroke:var(--accent);transition:stroke-dashoffset .2s linear}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900}
  .ring .pct small{font-size:13px;margin-top:10px}
  .loading-caption{text-align:center;font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-top:12px}
  .social-red{color:var(--accent-dark);text-align:center;font-weight:900;font-size:18px;margin-top:22px}
  .modal-bg{position:fixed;inset:0;background:rgba(40,48,56,.55);display:flex;align-items:flex-start;justify-content:center;padding-top:26vh;z-index:50}
  .modal{background:#fff;border-radius:14px;padding:20px 22px;max-width:320px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal h3{font-size:16px;font-weight:900;margin-bottom:6px}
  .modal p{font-size:13.5px;color:var(--ink-soft);font-weight:600;margin-bottom:16px;line-height:1.45}
  .modal .row{display:flex;gap:10px}
  .modal .row button{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
  .modal .row button:hover{border-color:var(--blue)}

  /* ---------- Email ---------- */
  .privacy{display:flex;gap:9px;font-size:11.5px;color:#9AA5AF;font-weight:600;line-height:1.5;margin-top:12px}

  /* ---------- Resultados ---------- */
  .rcard{border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px;box-shadow:0 2px 10px rgba(30,40,50,.04)}
  .rcard h4{font-size:13.5px;font-weight:800;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
  .rcard h4 .norm{font-size:11px;color:#9AA5AF;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-weight:800}
  .scorebar{position:relative;height:8px;border-radius:99px;background:linear-gradient(90deg,#E23B3B,#F5A623,#D6D64B,#7CC24B,#2E9BD6);margin:26px 0 6px}
  .scorebar .dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
  .scorebar .tag{position:absolute;bottom:14px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;font-weight:800;padding:4px 8px;border-radius:7px;white-space:nowrap}
  .score-scale{display:flex;justify-content:space-between;font-size:9.5px;font-weight:800;color:#9AA5AF;text-transform:uppercase;letter-spacing:.3px}
  .alert{background:#FDECEC;border-radius:10px;padding:12px 14px;font-size:12.5px;font-weight:600;line-height:1.5;color:#7A2E2E;margin-top:14px}
  .alert b{display:block;color:#B32B2B;margin-bottom:3px}
  .ficha{margin-top:14px}
  .ficha li{list-style:none;display:flex;gap:10px;padding:7px 0;font-size:13px;font-weight:600;color:var(--ink-soft);align-items:baseline}
  .ficha li b{color:var(--ink);font-weight:800}
  .perfil{background:var(--blue-soft);border-radius:var(--radius);padding:18px;margin-bottom:18px}
  .perfil .tagp{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--blue)}
  .perfil h3{font-size:18px;font-weight:900;margin:4px 0 8px}
  .perfil p{font-size:13.5px;font-weight:600;line-height:1.55;color:var(--ink-soft)}
  .vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
  .vs .col{border:1px solid var(--line);border-radius:12px;padding:14px}
  .vs .pill{font-size:11px;font-weight:900;border-radius:99px;padding:3px 10px;display:inline-block;margin-bottom:10px}
  .vs .now .pill{background:var(--card);color:var(--ink-soft)}
  .vs .after .pill{background:var(--blue);color:#fff}
  .vs .dog{font-size:44px;text-align:center;margin:6px 0 10px}
  .vs dt{font-size:11px;font-weight:800;color:var(--ink-soft);margin-top:8px}
  .vs dd{font-size:13px;font-weight:800;margin-bottom:4px}
  .bars{display:flex;gap:3px;margin-top:2px}
  .bars i{height:6px;flex:1;border-radius:3px;background:var(--line)}
  .bars.red i.on{background:var(--bad)}
  .bars.blue i.on{background:var(--blue)}
  .offer-top{background:var(--blue);color:#fff;border-radius:12px;padding:10px;text-align:center;font-size:13px;font-weight:800;margin-bottom:14px}
  .offer-top b{color:#FFD34D}
  .promo{background:#E9F9F0;border:1px dashed #7ED8A8;border-radius:12px;padding:12px 14px;margin-bottom:14px;text-align:center}
  .promo .lbl{font-size:12.5px;font-weight:800;color:#1E7A4C;margin-bottom:8px}
  .promo .code{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1.5px solid #7ED8A8;border-radius:9px;padding:9px 12px;font-weight:800;font-size:14px}
  .promo .code .t{color:#1E7A4C;font-variant-numeric:tabular-nums}
  .plan{border:2px solid var(--line);border-radius:12px;padding:0;margin-bottom:12px;overflow:hidden;cursor:pointer;position:relative}
  .plan.sel{border-color:var(--blue)}
  .plan .pop{background:var(--blue);color:#fff;text-align:center;font-size:11px;font-weight:900;padding:5px;letter-spacing:.4px}
  .plan .row{display:flex;align-items:center;gap:12px;padding:14px}
  .plan .disc{position:absolute;top:0;left:0;background:var(--bad);color:#fff;font-size:11px;font-weight:900;padding:3px 8px;border-radius:0 0 8px 0}
  .plan.sel .disc{top:auto}
  .plan .pop + .row .disc{top:24px}
  .plan .radio{width:19px;height:19px;border-radius:50%;border:2px solid #C9D2DA;flex:0 0 19px;position:relative}
  .plan.sel .radio{border-color:var(--blue)}
  .plan.sel .radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--blue)}
  .plan .nm b{display:block;font-size:14px;font-weight:900}
  .plan .nm span{font-size:12px;color:#9AA5AF;font-weight:700;text-decoration:line-through}
  .plan .nm .real{color:var(--ink);text-decoration:none;margin-left:4px}
  .plan .pd{margin-left:auto;background:var(--card);border-radius:10px;padding:8px 12px;text-align:center}
  .plan .pd b{font-size:17px;font-weight:900;display:block}
  .plan .pd span{font-size:10px;font-weight:800;color:var(--ink-soft)}
  .legal{font-size:11px;color:#9AA5AF;font-weight:600;text-align:center;line-height:1.5;margin-top:10px}
  .guar{text-align:center;font-size:12.5px;font-weight:800;margin:14px 0 22px}
  .get{margin-bottom:20px}
  .get li{list-style:none;display:flex;gap:9px;font-size:13.5px;font-weight:700;padding:6px 0}
  .get li::before{content:'✅';flex:0 0 auto}
  .faq details{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px}
  .faq summary{font-size:13.5px;font-weight:800;cursor:pointer;list-style:none;display:flex;gap:8px}
  .faq summary::before{content:'💬'}
  .faq p{font-size:13px;font-weight:600;color:var(--ink-soft);line-height:1.55;margin-top:8px}
  .metodo{display:grid;gap:12px;margin-bottom:20px}
  .metodo .step{display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;padding:13px}
  .metodo .n{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
  .metodo b{font-size:13.5px;display:block;margin-bottom:2px}
  .metodo p{font-size:12.5px;font-weight:600;color:var(--ink-soft);line-height:1.5}
  .sec-title{font-size:17px;font-weight:900;text-align:center;margin:26px 0 14px}
  footer{text-align:center;font-size:11px;color:#9AA5AF;font-weight:600;margin-top:30px;line-height:2}
  footer a{color:var(--ink-soft)}
  .fade{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="back" id="backBtn" aria-label="Volver">‹</button>
    <div class="logo"><span class="paw">🐾</span><span id="brandName"></span></div>
  </header>
  <div class="progress"><i id="pbar" style="width:0%"></i></div>
  <main id="screen" class="fade" style="display:flex;flex-direction:column;flex:1"></main>
</div>

<script>
/* ================= CONFIG ================= */
const BRAND  = "BuenPerro™";
const N_REAL = "12.000";           // ← reemplazar por tu número real de rutinas/leads
const PRODUCTO = "La Rutina Ideal™";
const OFERTA = {                   // Mercado Pago, pago único
  precioAntes:"$49.900",
  precioHoy:"$14.999",
  anclaje:"Una sola sesión con un adiestrador presencial cuesta más del doble — y esto lo tenés para siempre.",
  items:[
    {em:"📘", n:"EBOOK PRINCIPAL — La Rutina Ideal™ de Modales para tu Perro", d:"El método completo día por día: 4 semanas de rutinas de 15 minutos con refuerzo positivo.", v:"$22.900"},
    {em:"🎁", n:"BONO 1 — Guía Paseos Sin Tirones", d:"El protocolo paso a paso para que la correa deje de ser una lucha.", v:"$6.900"},
    {em:"🎁", n:"BONO 2 — Visitas y Timbre Bajo Control", d:"Qué hacer (y qué no) cuando suena el timbre o llega gente a casa.", v:"$5.900"},
    {em:"🎁", n:"BONO 3 — Calendario de 28 Días Imprimible", d:"Planilla de seguimiento para marcar cada día completado y sostener el hábito.", v:"$3.900"},
    {em:"🎁", n:"BONO 4 — Kit Anti-Ansiedad", d:"Ejercicios para perros que sufren al quedarse solos o con ruidos fuertes.", v:"$6.400"},
    {em:"🎁", n:"BONO 5 — Recetario de Premios Caseros", d:"Premios económicos y sanos para entrenar sin gastar de más.", v:"$3.900"}
  ]
};
const DESCUENTO = "70%";

/* ================= ESTADO ================= */
/* Shim: usa sessionStorage si está disponible; si el entorno lo bloquea (previews), cae a memoria */
const MEM = {};
const store = {
  get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return (k in MEM)? MEM[k] : null; } },
  set(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} MEM[k]=String(v); }
};
let S = {};
S.estres      = [];
S.mejorar     = [];
S.modales     = [];
S.convivencia = [];
S.refuerzos   = [];
let idx = 0;
function save(){ S._idx = idx; store.set("quizState", JSON.stringify(S)); }

/* ============ HELPERS DINÁMICOS ============ */
const g   = (o,a)=> S.sexo==="hembra" ? a : o;                       // género del perro
const per = ()=> "tu perro";
const perN= ()=> S.nombre ? S.nombre : per();
const raza= ()=> (!S.raza || S.raza==="Mestizo" || S.raza==="Otra") ? "perro" : S.raza;
const esMestizo = ()=> !S.raza || S.raza==="Mestizo" || S.raza==="Otra";
function fechaMeta(){
  const d = new Date(); d.setDate(d.getDate()+28);
  return d.toLocaleDateString("es-AR",{day:"numeric",month:"long",year:"numeric"});
}
function promoCode(){
  const d=new Date(), m=d.toLocaleDateString("es-AR",{month:"short"}).replace(".","");
  return (S.nombre||"perro").toLowerCase().replace(/\s+/g,"")+"_"+m+String(d.getFullYear()).slice(2);
}

/* ================= PANTALLAS ================= */
const steps = [

/* 1 — Edad */
{ id:"edad", render:()=> singleChoice({
  h:"DESCUBRÍ LA RUTINA IDEAL PARA TU PERRO",
  sub:"Respondé 3 minutos de preguntas y descubrí por qué tira, salta o ladra — y el plan de 15 minutos al día para cambiarlo.",
  key:"edad",
  opts:[
    {v:"cachorro", em:"🐶", b:"Cachorro",     s:"Menos de 6 meses"},
    {v:"joven",    em:"🐕", b:"Perro joven",  s:"6 a 18 meses"},
    {v:"adulto",   em:"🦮", b:"Perro adulto", s:"1,5 a 7 años"},
    {v:"senior",   em:"🐕‍🦺", b:"Perro senior", s:"Más de 7 años"}
  ],
  footer:`Al continuar, aceptás los <a href="#">Términos de uso</a>, la <a href="#">Política de privacidad</a> y la <a href="#">Política de cookies</a>.`
})},

/* 2 — Sexo */
{ id:"sexo", render:()=> singleChoice({
  h:`${cap(per())} es...`,
  key:"sexo",
  opts:[
    {v:"macho",  em:"♂️", b:"Macho"},
    {v:"hembra", em:"♀️", b:"Hembra"}
  ]
})},

/* 3 — Tamaño */
{ id:"tamano", render:()=> singleChoice({
  h:`¿Qué tamaño tiene ${per()}?`,
  key:"tamano",
  opts:[
    {v:"chico",   em:"🐕", b:"Chico",   s:"Hasta 10 kg"},
    {v:"mediano", em:"🦮", b:"Mediano", s:"10 a 25 kg"},
    {v:"grande",  em:"🐕‍🦺", b:"Grande",  s:"Más de 25 kg"}
  ]
})},

/* 4 — Objetivo */
{ id:"objetivo", render:()=> singleChoice({
  h:`¡Definamos el objetivo principal de la rutina de ${per()}!`,
  sub:"Elegí tu prioridad:",
  key:"objetivo",
  opts:[
    {v:"atencion", em:"🗣️", b:"Que me preste atención y me haga caso en cualquier lugar"},
    {v:"modales",  em:"✨",  b:"Mejores modales en casa y con visitas"},
    {v:"vinculo",  em:"❤️", b:"Crear un vínculo más fuerte con mi perro"},
    {v:"paseos",   em:"🧘", b:"Paseos tranquilos, sin tirones ni escenas"}
  ]
})},

/* 5 — Interstitial social */
{ id:"social", render:()=>`
  <h1 class="accb-h"><span class="accb">Más de ${N_REAL} dueños de perros</span><br>ya crearon su rutina</h1>
  <p class="sub">Descubrieron con <b>${PRODUCTO}</b> que el problema nunca fue el perro ni el dueño: era el método.</p>
  <div class="quote"><span class="qm">“</span>
    <p>Tu perro no necesita más órdenes ni más disciplina. Necesita hábitos reales: rutinas cortas, todos los días.</p>
    <div class="who">🐾 <b>Equipo ${BRAND}</b></div>
  </div>
  <ul class="trust">
    <li>Método de refuerzo positivo, respaldado por la evidencia en comportamiento canino</li>
    <li>15 minutos al día para 24 horas de tranquilidad</li>
    <li>Garantía de 30 días atada al resultado</li>
  </ul>
  <div style="margin-top:auto"></div>
  <button class="btn" onclick="next()">Continuar</button>`},

/* 6 — Interstitial general (antes: raza específica) */
{ id:"intRaza", render:()=>`

function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function singleChoice({h,sub,img,key,opts,footer}){

        ${o.em?`<span class="em">${o.em}</span>`:""}
        <span class="tx"><b>${o.b.replace(/\$\{g\('([^']*)','([^']*)'\)\}/g,(m,a,b)=>g(a,b))}</b>${o.s?`<span>${o.s}</span>`:""}</span>
      </button>`).join("")}
    ${footer?`<footer style="margin-top:auto">${footer}<br>Todos los derechos reservados. ${new Date().getFullYear()}</footer>`:""}`;
}

function multiChoice({h,sub,key,opts,btn}){

/* ============ INTERACCIÓN ============ */
function pick(key,val,advance){
  S[key]=val; save();
  if(advance){ setTimeout(next,180); } else { render(); }
}
function toggle(key,val,exclusive,exclusiveList){
  const excl=(exclusiveList||"").split(",").filter(Boolean);
  let arr=S[key];
  if(exclusive){ arr=arr.includes(val)?[]:[val]; }
  else{
    arr=arr.filter(v=>!excl.includes(v));
    arr.includes(val)? arr=arr.filter(v=>v!==val) : arr.push(val);
  }
  S[key]=arr; save(); render();
}
function next(){ if(idx<steps.length-1){ idx++; save(); render(); window.scrollTo(0,0);} }
function back(){ if(idx>0){ idx--; save(); render(); } }

function startLoading(){
  let p=0; const C=326.7;
  const fg=document.getElementById("ringFg"), num=document.getElementById("pctNum");
  const timer=setInterval(()=>{
    if(!document.getElementById("ringFg")){ clearInterval(timer); return; }
    p++;
    num.textContent=p;
    fg.style.strokeDashoffset = C - (C*p/100);
    if(p===32 && S.pausa1===undefined){ clearInterval(timer); askModal(
      "Una pregunta más",
      `¿Te estresa el comportamiento de ${perN()} cuando hay otras personas?`,
      "pausa1", ()=>resumeLoading(p)); return; }
    if(p===82 && S.pausa2===undefined){ clearInterval(timer); askModal(
      "Finalizando tu rutina",
      `¿Podés dedicarle 15 minutos por día a ${perN()}?`,
      "pausa2", ()=>resumeLoading(p)); return; }
    if(p>=100){ clearInterval(timer); setTimeout(next,500); }
  },45);
}
function resumeLoading(from){
  let p=from; const C=326.7;
  const fg=document.getElementById("ringFg"), num=document.getElementById("pctNum");
  const timer=setInterval(()=>{
    if(!document.getElementById("ringFg")){ clearInterval(timer); return; }
    p++;
    num.textContent=p;
    fg.style.strokeDashoffset = C - (C*p/100);
    if(p===82 && S.pausa2===undefined){ clearInterval(timer); askModal(
      "Finalizando tu rutina",`¿Podés dedicarle 15 minutos por día a ${perN()}?`,"pausa2",()=>resumeLoading(p)); return; }
    if(p>=100){ clearInterval(timer); setTimeout(next,500); }
  },45);
}

/* ============ SCORE + PERFIL ============ */
function calcScore(){
  let s=10;
  ["lik1","lik2","lik3"].forEach(k=>{ if(S[k]>=4) s-=0.8; });
  if(S.timbre==="si") s-=0.7;
  if(S.salta==="si")  s-=0.7;
  if(S.ladra==="siempre") s-=0.8; else if(S.ladra==="aveces") s-=0.4;
  if(S.correa==="mucho") s-=0.8; else if(S.correa==="aveces") s-=0.4;
  const estresReal=S.estres.filter(v=>v!=="ninguna");
  s-=Math.min(estresReal.length*0.3,1.5);
  s-=Math.min(S.mejorar.length*0.4,2);
  return Math.max(1.5, Math.round(s*10)/10);
}
function scoreLabel(s){ return s<3?"MUY BAJO": s<5?"BAJO": s<7.5?"PROMEDIO":"EXCELENTE"; }
function reactividad(){
  let r=0;
  if(S.timbre==="si")r++; if(S.salta==="si")r++;
  if(S.ladra==="siempre")r+=2; else if(S.ladra==="aveces")r++;
  if(S.correa==="mucho")r+=2; else if(S.correa==="aveces")r++;
  return r>=4?"Alta": r>=2?"Media":"Baja";
}
function sensibilidad(){
  const n=S.estres.filter(v=>v!=="ninguna").length;
  return n>=4?"Alta": n>=2?"Media":"Baja";
}
function conductaTop(){
  const map={ladridos:"Ladridos excesivos",energia:"Energía desbordada",reactividad:"Reactividad",correa:"Tirones de correa",ansiedad:"Ansiedad por separación",ensuciar:"Ensuciar en casa",destructivo:"Comportamiento destructivo"};
  return map[S.mejorar[0]] || "Modales generales";
}
function perfil(){
  const n=perN(), m=S.mejorar, e=S.estres;
  const pts={torbellino:0,guardian:0,explorador:0,sensible:0};
  if(S.salta==="si")pts.torbellino+=2;
  if(m.includes("energia"))pts.torbellino+=2;
  if(e.includes("gente"))pts.torbellino++;
  if(S.ladra==="siempre")pts.guardian+=2; else if(S.ladra==="aveces")pts.guardian++;
  if(S.timbre==="si")pts.guardian+=2;
  if(m.includes("reactividad")||m.includes("ladridos"))pts.guardian++;
  if(S.correa==="mucho")pts.explorador+=2; else if(S.correa==="aveces")pts.explorador++;
  if(S.lik1>=4)pts.explorador+=2;
  if(m.includes("correa"))pts.explorador++;
  if(m.includes("ansiedad"))pts.sensible+=2;
  if(e.includes("ruidos"))pts.sensible++; if(e.includes("solo"))pts.sensible++;
  if(sensibilidad()==="Alta")pts.sensible++;
  const win=Object.entries(pts).sort((a,b)=>b[1]-a[1])[0][0];
  const P={
    torbellino:{n:"El Torbellino Social", t:`${n} no es ${g("maleducado","maleducada")}: le sobra amor y le falta un canal. La rutina le enseña a saludar sin revolear a nadie.`},
    guardian:{n:"El Guardián Ruidoso", t:`${n} siente que cuidar la casa es su trabajo. Vamos a enseñarle cuándo el trabajo terminó.`},
    explorador:{n:"El Explorador con Agenda Propia", t:`${n} pasea con vos... pero según su plan. La rutina invierte los roles sin gritos ni tirones.`},
    sensible:{n:"El Sensible", t:`${n} no se porta mal: se preocupa de más. La rutina baja su ansiedad para que los modales salgan solos.`}
  };
  return P[win];
}

/* ============ COUNTDOWN PERSISTENTE ============ */
function startCountdowns(){
  let end = store.get("offerEnd");
  if(!end){ end = Date.now()+10*60*1000; store.set("offerEnd",end); }
  const t=setInterval(()=>{
    const a=document.getElementById("cd1"), b=document.getElementById("cd2");
    if(!a){ clearInterval(t); return; }
    let ms=Math.max(0,end-Date.now());
    const mm=String(Math.floor(ms/60000)).padStart(2,"0"), ss=String(Math.floor(ms%60000/1000)).padStart(2,"0");
    a.textContent=`${mm}:${ss}`; if(b)b.textContent=`${mm}:${ss}`;
    if(ms<=0)clearInterval(t);
  },1000);
}

/* ============ CHECKOUT ============ */
function checkout(){
  /* 1) Reemplazá "TU-TIENDA.com" por el dominio real de tu tienda Shopify
        (el que ves en la barra del navegador cuando entrás a comprar).
     2) El número después de /cart/ es el Variant ID del producto "Buen Perro".
     3) El ":1" indica la cantidad (1 unidad). */
  const DOMINIO_TIENDA = "yjn2e9-s0.myshopify.com";
  const VARIANT_ID = "59850037690449";
  location.href = `https://${DOMINIO_TIENDA}/cart/${VARIANT_ID}:1`;
}

/* ============ MOTOR ============ */
function render(){
  document.getElementById("brandName").textContent=BRAND;
  const step=steps[idx];
  document.getElementById("pbar").style.width=(idx/(steps.length-1)*100)+"%";
  document.getElementById("backBtn").style.visibility=(idx===0||step.noBack)?"hidden":"visible";
  const sc=document.getElementById("screen");
  sc.classList.remove("fade"); void sc.offsetWidth; sc.classList.add("fade");
  sc.innerHTML=step.render();
}
document.getElementById("backBtn").onclick=back;
render();
